name: Build Windows Portable

on:
  push:
    branches: [ "main", "master" ] # Сборка будет запускаться при пуше в эти ветки
  workflow_dispatch: # Позволит запускать сборку вручную кнопкой на GitHub

jobs:
  build-windows:
    runs-on: windows-latest # Запускаем на виндовой машине гитхаба

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle' # Или 'zulu', у них у обоих есть стабильный JDK 22
          java-version: '22'
          cache: 'gradle' # Кэшируем зависимости, чтобы собиралось быстрее

      - name: Grant execute permission for gradlew
        run: git update-index --chmod=+x gradlew
        shell: bash

      - name: Build Portable App Image (EXE + JRE 22)
        run: ./gradlew packageAppImage --no-daemon

      - name: Archive Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compose-App-Windows-Portable
          path: build/compose/binaries/main/appImage/
          retention-days: 5 # Ссылка на скачивание будет жить 5 дней
