name: build-desktop-distributions

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}   # позволяет запускать вручную из вкладки Actions

jobs:
  build:
    strategy:
      fail-fast: false   # если упадёт сборка на одной ОС, остальные всё равно доедут
      matrix:
        include:
          - os: ubuntu-latest
            task: :desktopApp:packageReleaseDeb
            artifact_glob: desktopApp/build/compose/binaries/main-release/deb/*.deb
            artifact_name: linux-deb
          - os: ubuntu-latest
            task: :desktopApp:packageReleaseRpm
            artifact_glob: desktopApp/build/compose/binaries/main-release/rpm/*.rpm
            artifact_name: linux-rpm
            rpm: true
          - os: windows-latest
            task: :desktopApp:packageReleaseExe
            artifact_glob: desktopApp/build/compose/binaries/main-release/exe/*.exe
            artifact_name: windows-exe
          - os: windows-latest
            task: :desktopApp:createReleaseDistributable
            artifact_glob: desktopApp/build/compose/binaries/main-release/app/**
            artifact_name: windows-portable
            portable: true
          - os: macos-latest
            task: :desktopApp:packageReleaseDmg
            artifact_glob: desktopApp/build/compose/binaries/main-release/dmg/*.dmg
            artifact_name: macos-dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # WiX нужен только для Exe/Msi — для portable-сборки (createReleaseDistributable) не требуется.
      - name: Ensure WiX Toolset (Windows only, non-portable)
        if: runner.os == 'Windows' && matrix.portable != true
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y
          }
        shell: pwsh

      - name: Add WiX to PATH (Windows only, non-portable)
        if: runner.os == 'Windows' && matrix.portable != true
        run: echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH
        shell: pwsh

      # rpmbuild не входит в образ ubuntu-latest по умолчанию — без него
      # jpackage тихо падает на этапе упаковки .rpm.
      - name: Ensure rpmbuild (Linux rpm only)
        if: matrix.rpm == true
        run: |
          if ! command -v rpmbuild &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y rpm
          fi
        shell: bash

      - name: Make gradlew executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build distribution
        run: ./gradlew ${{ matrix.task }} --stacktrace --no-daemon

      - name: Zip portable build (Windows portable only)
        if: matrix.portable == true
        shell: pwsh
        run: |
          Compress-Archive -Path "desktopApp/build/compose/binaries/main-release/app/*" -DestinationPath "VSPMLauncher-windows-portable.zip"

      - name: Show jpackage error log on failure
        if: failure()
        shell: bash
        run: |
          echo "=== Searching for jpackage error logs ==="
          find . -path "*/compose/logs/*" -name "*-err.txt" -exec echo "--- {} ---" \; -exec cat {} \;
          find . -path "*/compose/logs/*" -name "*-out.txt" -exec echo "--- {} ---" \; -exec cat {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.portable == true && 'VSPMLauncher-windows-portable.zip' || matrix.artifact_glob }}
          if-no-files-found: error

  # Если пуш был по тегу вида v1.2.3 — собираем все артефакты
  # в один GitHub Release автоматически.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux-deb/*.deb
            dist/linux-rpm/*.rpm
            dist/windows-exe/*.exe
            dist/windows-portable/*.zip
            dist/macos-dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}